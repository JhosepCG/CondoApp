name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Convive-v0.8.0/Convive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pruebas unitarias
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log
          st=${PIPESTATUS[0]}
          grep -E "^e: |FAILED" test.log | head -20 | sed 's/^/::error::/'
          exit $st

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: Convive-v0.8.0/Convive/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Compilar APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          st=${PIPESTATUS[0]}
          # Mostrar los errores de Kotlin como anotaciones (se ven en el resumen de la compilación)
          grep -E "^e: " build.log | head -20 | sed 's/^/::error::/'
          exit $st

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Convive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Convive-apk
          path: Convive-v0.8.0/Convive/Convive.apk

      - name: Publicar APK en Releases (descarga directa desde el celular)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Convive · compilación ${{ github.run_number }}
          files: Convive-v0.8.0/Convive/Convive.apk
          make_latest: true
