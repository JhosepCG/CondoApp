name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Convive-v0.8.0/CondoApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Convive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Convive-apk
          path: Convive-v0.8.0/CondoApp/Convive.apk

      - name: Publicar APK en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Convive · compilación ${{ github.run_number }}
          files: Convive-v0.8.0/CondoApp/Convive.apk
          make_latest: true
